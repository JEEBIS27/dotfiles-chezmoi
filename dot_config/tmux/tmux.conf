# Alt owns the Herdr/tmux layer; regular actions need no prefix.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind q source-file ~/.config/tmux/tmux.conf \; display-message "Configuration reloaded"
bind ? list-keys
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Retire the former global pane/tab/session shortcuts when reloading.
unbind -n M-Enter
unbind -n M-S-Enter
unbind -n M-Escape
unbind -n C-M-Left
unbind -n C-M-Down
unbind -n C-M-Up
unbind -n C-M-Right
unbind -n C-M-S-Left
unbind -n C-M-S-Down
unbind -n C-M-S-Up
unbind -n C-M-S-Right
unbind -n M-Left
unbind -n M-Down
unbind -n M-Up
unbind -n M-Right
unbind -n M-S-Left
unbind -n M-S-Down
unbind -n M-S-Up
unbind -n M-S-Right
bind -n M-h select-pane -L
bind -n M-H resize-pane -L 5
bind -n M-Left select-pane -L
bind -n M-S-Left resize-pane -L 5
bind -T exchange h swap-pane -t '{left-of}'
bind -T exchange Left swap-pane -t '{left-of}'
bind -n M-j select-pane -D
bind -n M-J resize-pane -D 5
bind -n M-Down select-pane -D
bind -n M-S-Down resize-pane -D 5
bind -T exchange j swap-pane -t '{down-of}'
bind -T exchange Down swap-pane -t '{down-of}'
bind -n M-k select-pane -U
bind -n M-K resize-pane -U 5
bind -n M-Up select-pane -U
bind -n M-S-Up resize-pane -U 5
bind -T exchange k swap-pane -t '{up-of}'
bind -T exchange Up swap-pane -t '{up-of}'
bind -n M-l select-pane -R
bind -n M-L resize-pane -R 5
bind -n M-Right select-pane -R
bind -n M-S-Right resize-pane -R 5
bind -T exchange l swap-pane -t '{right-of}'
bind -T exchange Right swap-pane -t '{right-of}'
bind -T exchange Escape switch-client -T root
bind -T exchange Any switch-client -T root
bind -T exchange PageUp swap-window -t -1
bind -T exchange PageDown swap-window -t +1
bind -T exchange M-F5 swap-window -t -1
bind -T exchange M-F6 swap-window -t +1
bind -n M-e switch-client -T exchange
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n M-S-Enter split-window -v -c "#{pane_current_path}"
bind -n M-w kill-pane
bind -n M-W confirm-before -p 'Close window #W? (y/n)' kill-window
bind -n M-F resize-pane -Z
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-N new-session -c "#{pane_current_path}"
bind -n M-y split-window -h -c "#{pane_current_path}" 'zsh -i -c y'
bind -n M-Y copy-mode
bind -n M-f copy-mode \; command-prompt -p Search "send-keys -X search-backward -- '%%'"
bind -n M-t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 'zsh -i'
bind -n M-T next-layout
bind -n M-Tab next-window
bind -n M-BTab previous-window
bind -n M-F9 previous-window
bind -n M-PageUp previous-window
bind -n M-PageDown next-window
bind -n M-S-PageUp switch-client -p
bind -n M-S-PageDown switch-client -n
# WezTerm's Herdr-compatible Page adapters.
bind -n M-F5 previous-window
bind -n M-F6 next-window
bind -n M-F7 switch-client -p
bind -n M-F8 switch-client -n
bind -n M-g choose-tree -s
bind -n M-r command-prompt -I '#W' "rename-window -- '%%'"
bind -n M-R command-prompt -I '#S' "rename-session -- '%%'"
bind -n M-d detach-client
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys,wezterm:extkeys,xterm-256color:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue
